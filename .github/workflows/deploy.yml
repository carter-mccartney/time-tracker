# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup in the GitHub repo:
#   Settings > Pages > Source: "GitHub Actions"
#   Settings > Secrets and variables > Actions > Variables: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Supabase settings are present
        run: |
          if [ -z "${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}" ]; then
            echo "::warning::VITE_SUPABASE_URL is not set, so the site will save data only in each browser (no sign-in). Add it under Settings > Secrets and variables > Actions."
          fi
      - run: npm run build
        env:
          # Accepts either repo Variables or repo Secrets with these names.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_GITHUB_LOGIN: ${{ vars.VITE_ENABLE_GITHUB_LOGIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
